# Release notes are generated from the commit history, which is Conventional
# Commits throughout. Nothing depends on pull request labels, so a tag pushed
# from a local branch produces the same notes as one merged through a PR.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.breaking %} **(breaking)**{% endif %}\
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# Commits that do not parse as Conventional say nothing useful in a release.
filter_unconventional = true
filter_commits = true
topo_order = false
sort_commits = "newest"

# First match wins, so everything skipped comes first. A `fix(ci)` reached the
# `^fix` line before it ever reached `^ci`, and turned up in the notes under
# Fixes — which reads, to somebody about to download a DJ tool, as though
# something they use had been broken.
commit_parsers = [
  # Internal by scope, whatever the type precedes it.
  { message = '^\w+\(ci\)', skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  # Not skipped: what this changes is the size and contents of the download.
  { message = "^build", group = "Packaging" },
]
