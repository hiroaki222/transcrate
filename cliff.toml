# Release notes are generated from the commit history, which is Conventional
# Commits throughout. Nothing depends on pull request labels, so a tag pushed
# from a local branch produces the same notes as one merged through a PR.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.breaking %} **(breaking)**{% endif %}\
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# Commits that do not parse as Conventional say nothing useful in a release.
filter_unconventional = true
filter_commits = true
topo_order = false
sort_commits = "newest"

# Groups carry a number in a comment that the template strips out, because
# group_by sorts them alphabetically otherwise — which put eight lines of
# README wording above the three features on the download page.
#
# First match wins, so everything skipped comes first. A `fix(ci)` reached the
# `^fix` line before it ever reached `^ci`, and turned up in the notes under
# Fixes — which reads, to somebody about to download a DJ tool, as though
# something they use had been broken.
commit_parsers = [
  # Internal by scope, whatever the type precedes it.
  { message = '^\w+\(ci\)', skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 5 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  # Not skipped: what this changes is the size and contents of the download.
  { message = "^build", group = "<!-- 3 -->Packaging" },
]
