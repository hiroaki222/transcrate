name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    # The GUI ships on macOS and Windows, so the core is tested on both rather
    # than on Linux alone.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The runners do not ship ffmpeg. The integration tests are the only ones
      # that put an argument list in front of a real encoder, and they refuse to
      # run without it rather than skipping, so this is what keeps them honest.
      #
      # Each platform's own package manager rather than a setup action: the
      # actions distribute static builds, and there is not always one for the
      # arm64 macOS runners.
      - name: Install ffmpeg
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg --no-progress --yes ;;
            *)       echo "no ffmpeg recipe for ${{ runner.os }}" >&2; exit 1 ;;
          esac
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
