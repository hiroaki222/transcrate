name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The window's crate is a workspace member, so linting the workspace
      # compiles it, and compiling it needs WebKit's headers even though the
      # app itself never ships on Linux.
      - name: Install the toolkit the window builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    # The window ships on macOS and Windows, so the core is tested on both
    # rather than on Linux alone.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolkit the window builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      # The runners do not ship ffmpeg. The integration tests are the only ones
      # that put an argument list in front of a real encoder, and they refuse to
      # run without it rather than skipping, so this is what keeps them honest.
      #
      # Package managers where they are dependable, and a direct download on
      # Windows because Chocolatey's ffmpeg has gone missing from the feed more
      # than once. Setup actions were tried and dropped: they distribute static
      # builds, and there is not always one for the arm64 macOS runners.
      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail

          case "${{ runner.os }}" in
            Linux)
              sudo apt-get install -y ffmpeg
              ;;
            macOS)
              brew install ffmpeg
              ;;
            Windows)
              curl -fsSL -o ffmpeg.zip \
                https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
              unzip -q ffmpeg.zip
              # The archive's top folder carries the build date, so it is found
              # rather than named.
              find . -maxdepth 3 -type d -name bin -path './ffmpeg-*' \
                | head -1 >> "$GITHUB_PATH"
              ;;
            *)
              echo "no ffmpeg recipe for ${{ runner.os }}" >&2
              exit 1
              ;;
          esac

      - name: Check ffmpeg answers
        shell: bash
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # The window's TypeScript is not built by cargo, so nothing else would notice
  # a type error or a broken import until somebody opened the app.
  window:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
