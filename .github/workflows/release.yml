name: Release

on:
  push:
    tags: ["v*"]
  # Everything here is reachable only by tagging, which makes a change to it
  # unrunnable until the moment it matters. This builds and verifies without
  # publishing: the release steps are all guarded on the tag.
  workflow_dispatch:

# Read by default. The four jobs that put something on the release page ask
# for write themselves, so a build step cannot reach the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The draft is made first so every other job has somewhere to upload to, and
  # it stays a draft until they have. A release that appears with the notes but
  # without the downloads reads as a broken release for as long as the builds
  # take.
  draft:
    # A manual run has no tag to release, so it stops after building and
    # verifying. Everything below that would write to a release is guarded the
    # same way.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff reads the whole history to work out what this tag added.
          fetch-depth: 0
          # Nothing here pushes. Left set, the token stays in .git/config for
          # every step that follows.
          persist-credentials: false

      # Fetched here rather than through the action, which gave up on a bad
      # connection and took the whole release with it.
      - name: Fetch git-cliff
        run: |
          set -euo pipefail
          version=2.13.1
          name="git-cliff-$version-x86_64-unknown-linux-gnu"

          bash .github/scripts/fetch.sh \
            "https://github.com/orhun/git-cliff/releases/download/v$version/$name.tar.gz" \
            cliff.tar.gz

          tar -xzf cliff.tar.gz
          find . -type f -name git-cliff -exec mv {} ./git-cliff \;
          chmod +x ./git-cliff
          ./git-cliff --version

      # The first-run notice goes last because GitHub renders the assets below
      # the body: the end of the text is the spot nearest the download links,
      # where someone about to download will actually read it. It lives here
      # rather than in CHANGELOG.md, which would repeat it once per version.
      - name: Assemble the release body
        run: |
          set -euo pipefail
          ./git-cliff --latest --strip all > release-body.md

          # An empty changelog means the tag matched no commits, which is a
          # mistake worth stopping for rather than publishing around. Asked
          # after the notice is appended, this passes on the notice alone.
          test -s release-body.md

          printf '\n' >> release-body.md
          cat .github/release-notice.md >> release-body.md

      # A candidate is marked as one. GitHub does not read the tag, so without
      # this a `-rc1` would sit at the top of the page as the current release.
      - name: Open a draft
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) pre=true ;;
            *)                      pre=false ;;
          esac

          # Created through the API rather than `gh release create`, because
          # the numeric id comes back in the response. Reading it afterwards
          # from the list endpoint raced the release into existence and came
          # back empty. tauri-action needs that id: handed anything else it
          # uploads nowhere and still reports success.
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f "tag_name=$GITHUB_REF_NAME" \
            -f "name=$GITHUB_REF_NAME" \
            -F "body=@release-body.md" \
            -F draft=true \
            -F "prerelease=$pre" \
            --jq .id)"

          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # Both builds come from the same script. Nothing publishes an LGPL ffmpeg for
  # macOS at all, and the one published for Windows is a full build — 115 MB a
  # binary against the 4 MB this produces, carried inside every download.
  #
  # GPL-only components are left out on purpose: this program is MIT or
  # Apache-2.0, and shipping a GPL build inside the same bundle would carry GPL
  # obligations into it. An LGPL build covers every format Transcrate writes.
  ffmpeg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            os: macos-latest
          # Cross-compiled: a Windows runner would need MSYS2 and a toolchain
          # build before it started, and this needs one apt install.
          - target: windows
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # nasm, or configure stops: without it the only way forward it offers is
      # --disable-x86asm, which is its own word for a build with no SIMD in it.
      - if: matrix.target == 'windows'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm

      - name: Cache the build
        id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-out
          key: ffmpeg-lgpl-${{ matrix.target }}-${{ hashFiles('.github/scripts/build-ffmpeg.sh') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-ffmpeg.sh ${{ matrix.target }} ffmpeg-out

      # Every failure here is an explicit exit, and none of it is `! cmd`.
      # Two ways that reads as a pass when it is not: `! ffmpeg | grep` succeeds
      # when there is no ffmpeg at all, because the pipeline fails, grep matches
      # nothing and the negation turns that into success; and `set -e` never
      # fires on a command whose status is inverted with `!`, so such a line
      # only decides anything when it happens to be the last one in the step.
      - name: Check the binaries exist and hold their licence
        shell: bash
        run: |
          set -euo pipefail

          suffix=""
          if [ "${{ matrix.target }}" = windows ]; then suffix=".exe"; fi

          for tool in ffmpeg ffprobe; do
            if [ ! -s "ffmpeg-out/$tool$suffix" ]; then
              echo "$tool was not built" >&2
              exit 1
            fi
          done

          # A cross-built binary cannot be run here, so the flags are read out
          # of the file rather than out of `-version`.
          # Read whole rather than stopped at the first match: closing the
          # pipe early leaves `strings` reporting a write error into a build
          # that is otherwise fine, and a passing job should say nothing.
          matches="$(strings -a "ffmpeg-out/ffmpeg$suffix" |
                     grep -- '--disable-everything' || true)"
          banner="${matches%%$'\n'*}"
          if [ -z "$banner" ]; then
            echo "no configure banner in the binary" >&2
            exit 1
          fi

          for forbidden in --enable-gpl --enable-nonfree; do
            if grep -qF -- "$forbidden" <<<"$banner"; then
              echo "$forbidden is in this build" >&2
              exit 1
            fi
          done

          echo "$banner" | tr ' ' '\n' | grep -c -- '--enable-'

          # A DLL the toolchain supplies would resolve on any machine with
          # MSYS2 installed, which is every runner this could be tried on and
          # no machine belonging to anyone who downloads it.
          if [ "${{ matrix.target }}" = windows ]; then
            objdump=x86_64-w64-mingw32-objdump
            command -v "$objdump" >/dev/null || objdump=objdump
            needs="$("$objdump" -p ffmpeg-out/ffmpeg.exe |
                     awk '/DLL Name:/ { print tolower($3) }' | sort -u)"
            echo "$needs"
            if grep -qE 'libwinpthread|libgcc|libstdc\+\+|msys' <<<"$needs"; then
              echo "the build depends on a DLL that ships with the toolchain" >&2
              exit 1
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-out/*

  # The suite runs real conversions, so pointing it at the build that ships is
  # the only thing that proves `--disable-everything` did not cut something the
  # app needs. Without it the binary in the download would be one nothing has
  # ever encoded with. It has to run on the system the binary is for, which for
  # Windows is not the system it was built on.
  ffmpeg-test:
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            os: macos-latest
          - target: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-out

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Convert with it
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ffmpeg-out/* || true
          ls -la ffmpeg-out

          # Unix form, deliberately. Bash splits PATH on colons, so a Windows
          # path put here becomes two broken entries — `D` and `/a/...` — and
          # nothing on it is ever found. Git Bash converts it back to Windows
          # form when it launches cargo. The other form belongs in $GITHUB_PATH,
          # which is read by the runner rather than by a shell.
          bin="$(cd ffmpeg-out && pwd)"
          export PATH="$bin:$PATH"
          ffmpeg -version | head -1
          cargo test -p transcrate-core --test convert_real_files --test probe_real_files

  bundle:
    needs: [draft, ffmpeg, ffmpeg-test]
    # `draft` is skipped on a manual run, which would take this with it. The
    # app is still built there: it is what proves the sidecars landed inside
    # the bundle, and tauri-action uploads nowhere without a release id.
    if: |
      always()
      && needs.ffmpeg.result == 'success'
      && needs.ffmpeg-test.result == 'success'
      && needs.draft.result != 'failure'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            ffmpeg: macos
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ffmpeg: windows
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.ffmpeg }}
          path: ffmpeg-in

      # Tauri looks for a sidecar named after the target triple and drops the
      # suffix when it bundles.
      - name: Put ffmpeg where Tauri expects it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gui/src-tauri/binaries

          for tool in ffmpeg ffprobe; do
            from="ffmpeg-in/$tool${{ matrix.suffix }}"
            test -s "$from"
            to="gui/src-tauri/binaries/$tool-${{ matrix.target }}${{ matrix.suffix }}"
            mv "$from" "$to"
            chmod +x "$to"
          done

          ls -la gui/src-tauri/binaries

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - run: bun install --frozen-lockfile
        working-directory: gui

      # Ad-hoc, with no certificate. Apple silicon refuses to run a binary
      # carrying no signature at all and reports it as damaged, which sends
      # people to the Trash rather than to the "open anyway" setting. Signing
      # for nobody is enough to turn that back into the ordinary unidentified
      # developer prompt.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: gui
          releaseId: ${{ needs.draft.outputs.id }}
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      # Ad-hoc signing the executable is not the same as sealing the bundle
      # around it. Without a `_CodeSignature` covering the sidecars, macOS
      # calls the app damaged and offers only the Trash — and that is invisible
      # here, where the app is never opened, until somebody downloads it.
      #
      # The sidecars are found rather than looked for at a fixed path: where
      # Tauri puts an externalBin inside the bundle is Tauri's business, and a
      # check that hard-codes it fails on a bundle that is fine.
      - name: Check the bundle is sealed around its sidecars
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          app="$(find target -maxdepth 5 -name 'Transcrate.app' | head -1)"
          if [ -z "$app" ]; then
            echo "no Transcrate.app was built" >&2
            exit 1
          fi

          for tool in ffmpeg ffprobe; do
            found="$(find "$app" -type f -name "$tool" | head -1)"
            if [ -z "$found" ]; then
              echo "$tool is not inside the bundle" >&2
              exit 1
            fi
            echo "$tool: ${found#"$app"/}"
          done

          # --deep reaches the nested executables, --strict refuses a seal that
          # does not match what is actually in the bundle.
          codesign --verify --deep --strict --verbose=2 "$app"

      # Kept whether or not there is a release to attach them to. The size of
      # the download is the reason ffmpeg is built here rather than fetched, and
      # a manual run is where that gets weighed.
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: error

  # The command line is a single file and wants no installer, so it ships as a
  # plain archive per platform.
  cli:
    needs: draft
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon only. Intel Macs are not a target: the last one
          # shipped in 2020, and building for them costs a second ffmpeg and a
          # universal bundle for a machine nobody is buying.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked -p transcrate-cli --target ${{ matrix.target }}

      # The name is carried to the next step rather than matched with a glob:
      # only one of the two archive kinds exists on any given runner, so a
      # pattern for the other reaches the uploader unexpanded and fails.
      - name: Pack it
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          name="transcrate-$GITHUB_REF_NAME-${{ matrix.target }}"
          out="target/${{ matrix.target }}/release"

          if [ "${{ runner.os }}" = "Windows" ]; then
            asset="$name.zip"
            7z a "$asset" "./$out/transcrate.exe" LICENSE-MIT LICENSE-APACHE README.md
          else
            asset="$name.tar.gz"
            tar -czf "$asset" -C "$out" transcrate \
              -C "$GITHUB_WORKSPACE" LICENSE-MIT LICENSE-APACHE README.md
          fi

          ls -la "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.pack.outputs.asset }}" --clobber

  publish:
    needs: [bundle, cli]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Every job has uploaded by now, so there is something to show.
      - name: Take it out of draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          count="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')"
          echo "assets: $count"
          # An empty release is worse than a missing one: it looks finished.
          test "$count" -gt 0

          gh release edit "$GITHUB_REF_NAME" --draft=false
